name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint & typecheck
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv sync --locked
      - name: Ruff lint
        run: uv run ruff check --output-format=github .
      - name: Ruff format
        run: uv run ruff format --check .
      - name: Pyright
        run: uv run pyright

  test:
    name: Tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - name: Install bubblewrap
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends bubblewrap
      - name: Allow unprivileged user namespaces
        # Ubuntu 24.04 restricts them via AppArmor, which breaks bwrap
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: Smoke-test bubblewrap
        # fail loudly here rather than letting the integration tests skip
        run: bwrap --ro-bind / / --dev /dev --proc /proc --unshare-all true
      - run: uv sync --locked
      - name: Pytest
        run: uv run pytest -ra
